<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Contatos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.min.css">
</head>

<body>

    <main class="container py-5">
        <div class="card p-4 mx-auto" style="max-width: 500px;">

            <div class="d-flex justify-content-between mb-3">
                <h2>Cadastro</h2>
                <button id="btnTema" class="btn btn-dark">Tema</button>
            </div>

            <p id="mensagemAjax"></p>

            <form id="formContato">
                <input type="text" id="nome" class="form-control mb-2" placeholder="Nome">
                <input type="email" id="email" class="form-control mb-2" placeholder="Email">
                <input type="text" id="telefone" class="form-control mb-2" placeholder="Telefone">

                <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
            </form>

            <p id="mensagem"></p>

            <ul id="listaContatos" class="list-group mt-3"></ul>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.min.js"></script>
</body>

</html>
